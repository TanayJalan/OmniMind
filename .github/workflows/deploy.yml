name: Deploy to HuggingFace Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Push to HuggingFace Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN:    ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          # Create fresh git repo — never use git add . (avoids picking up data/)
          rm -rf .git
          git init
          git config user.email "github-actions@github.com"
          git config user.name  "GitHub Actions"

          # Explicitly add only what HuggingFace Spaces needs
          # data/ is intentionally excluded
          git add api/ 2>/dev/null || true
          git add src/ 2>/dev/null || true
          git add data_pipeline/ 2>/dev/null || true
          git add mlflow_tracking/ 2>/dev/null || true
          git add .github/ 2>/dev/null || true
          git add app.py Dockerfile docker-compose.yml requirements.txt
          git add README.md .env.example .gitignore
          git add OmniMind_Phase3_Finetune.ipynb 2>/dev/null || true

          git commit -m "Deploy OmniMind to HuggingFace Spaces"

          SPACE_URL="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/omnimind"
          git remote add space "$SPACE_URL"
          git push space main --force
          echo "Deployed to https://huggingface.co/spaces/${HF_USERNAME}/omnimind"