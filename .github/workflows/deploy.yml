name: Deploy to HuggingFace Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Push to HuggingFace Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install huggingface_hub
        run: pip install huggingface_hub -q

      - name: Upload to HuggingFace Spaces
        env:
          HF_TOKEN:    ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          python3 << 'PYEOF'
          import os
          from huggingface_hub import HfApi

          api      = HfApi(token=os.environ["HF_TOKEN"])
          username = os.environ["HF_USERNAME"]
          repo_id  = f"{username}/omnimind"

          print(f"Uploading to https://huggingface.co/spaces/{repo_id} ...")

          api.upload_folder(
              folder_path=".",
              repo_id=repo_id,
              repo_type="space",
              ignore_patterns=[
                  "data/*",
                  "data/**/*",
                  "mlruns/*",
                  "omnimind-env/*",
                  "omnimind-env/**/*",
                  ".git/*",
                  "**/__pycache__/*",
                  "*.pyc",
                  "*.pt",
                  "*.bin",
                  "*.safetensors",
                  "mlflow.db",
                  "*.sqlite3",
              ],
          )

          print(f"Done! Visit: https://huggingface.co/spaces/{repo_id}")
          PYEOF