name: Deploy to HuggingFace Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Push to HuggingFace Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name  "GitHub Actions"

      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN:    ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          SPACE_URL="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/omnimind"
          git remote add space "$SPACE_URL" 2>/dev/null || git remote set-url space "$SPACE_URL"
          git push space main --force
          echo "Deployed to https://huggingface.co/spaces/${HF_USERNAME}/omnimind"