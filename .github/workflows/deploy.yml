name: Deploy to HuggingFace Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Push to HuggingFace Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN:    ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          # Remove large/unwanted files before pushing to HF
          rm -rf data/chroma_db mlruns omnimind-env
          find . -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc"  -delete 2>/dev/null || true
          find . -name "*.pt"   -delete 2>/dev/null || true
          find . -name "*.bin"  -delete 2>/dev/null || true
          find . -name "mlflow.db" -delete 2>/dev/null || true

          # Create a fresh git repo with only clean files
          rm -rf .git
          git init
          git config user.email "github-actions@github.com"
          git config user.name  "GitHub Actions"
          git add .
          git commit -m "Deploy OmniMind to HuggingFace Spaces"

          # Force push fresh history to HF Space
          SPACE_URL="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/omnimind"
          git remote add space "$SPACE_URL"
          git push space main --force
          echo "Deployed to https://huggingface.co/spaces/${HF_USERNAME}/omnimind"